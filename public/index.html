<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>User Authentication</title>
</head>

<body>

    <h1>User Authentication</h1>

    <h2>Sign Up</h2>

    <input
        type="text"
        id="signupName"
        placeholder="Name"
    >

    <input
        type="email"
        id="signupEmail"
        placeholder="Email"
    >

    <input
        type="password"
        id="signupPassword"
        placeholder="Password"
    >

    <button onclick="signup()">
        Sign Up
    </button>


    <h2>Log In</h2>

    <input
        type="email"
        id="loginEmail"
        placeholder="Email"
    >

    <input
        type="password"
        id="loginPassword"
        placeholder="Password"
    >

    <button onclick="login()">
        Log In
    </button>

    <p id="message"></p>


    <script>

        async function signup() {

            const name =
                document.getElementById("signupName").value;

            const email =
                document.getElementById("signupEmail").value;

            const password =
                document.getElementById("signupPassword").value;

            const response = await fetch("/signup", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name,
                    email,
                    password
                })
            });

            const data = await response.json();

            document.getElementById("message").textContent =
                data.message;
        }


        async function login() {

            const email =
                document.getElementById("loginEmail").value;

            const password =
                document.getElementById("loginPassword").value;

            const response = await fetch("/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email,
                    password
                })
            });

            const data = await response.json();

            if (data.success) {

                localStorage.setItem(
                    "username",
                    data.name
                );

                window.location.href =
                    "/dashboard.html";

            } else {

                document.getElementById("message").textContent =
                    data.message;
            }
        }

    </script>

</body>

</html>
